name: Vérification du service administrateur
on:
  push:
    branches: [main]
    paths:
      - 'administration/**'
      - 'supabase/**'
      - 'app/lib/**'
      - 'github-pages/**'
      - 'scripts/package-administration.mjs'
      - '.github/workflows/administration.yml'
  pull_request:
    paths:
      - 'administration/**'
      - 'supabase/**'
      - 'app/lib/**'
      - 'github-pages/**'
      - 'scripts/package-administration.mjs'
      - '.github/workflows/administration.yml'
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: administration/package-lock.json
      - run: npm ci --prefix administration
      - run: npm run check --prefix administration
      - run: npm test --prefix administration
      - run: npm run admin:package
      - run: node --experimental-strip-types -e "import('./supabase/functions/mediatheque/generated/service.ts')"
